# One origin for the web app and the API, so the browser never makes a
# cross-origin call. Set CORS_ORIGIN in /etc/auction/api.env to this
# site's https:// origin anyway; the API refuses "*" in production.
#
# Install: see packages/api/README.md, "TLS". certbot adds the 443 block.

upstream auction_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name auction.example.et;   # <- change

    client_max_body_size 21m;         # documents up to 20 MB

    root /srv/auction/current/packages/web/dist;
    index index.html;

    # Live auction updates are server-sent events: no buffering, long reads.
    location = /api/v1/events {
        proxy_pass http://auction_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://auction_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://auction_api;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the shell must always be revalidated.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Client-side routes (/auctions/..., /app/...) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
