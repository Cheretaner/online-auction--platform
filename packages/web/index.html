<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14532d" />
    <meta name="application-name" content="Cheretanet" />
    <meta name="color-scheme" content="light dark" />

    <!-- Search metadata -->
    <title>Cheretanet | Public Auctions in Ethiopia</title>
    <meta name="description" content="Explore public asset auctions in Ethiopia with Cheretanet. Review official auction notices, understand bidder requirements, follow live auctions, and see published results." />
    <meta name="author" content="Cheretanet" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://cheretanet.ethiodeploy.com/" />

    <!-- Open Graph previews for Facebook, WhatsApp, LinkedIn, and Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ET" />
    <meta property="og:url" content="https://cheretanet.ethiodeploy.com" />
    <meta property="og:title" content="Cheretanet | Public Auctions in Ethiopia" />
    <meta property="og:description" content="Review public auction notices, bidder requirements, live auctions, and published results on Cheretanet." />
    <meta property="og:image" content="https://cheretanet.ethiodeploy.com/images/seo-preview.png" />
    <meta property="og:image:secure_url" content="https://cheretanet.ethiodeploy.com/images/seo-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="685" />
    <meta property="og:image:height" content="498" />
    <meta property="og:image:alt" content="Cheretanet public auctions in Ethiopia" />
    <meta property="og:site_name" content="Cheretanet" />

    <!-- X / Twitter previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cheretanet.ethiodeploy.com" />
    <meta name="twitter:title" content="Cheretanet | Public Auctions in Ethiopia" />
    <meta name="twitter:description" content="Review public auction notices, bidder requirements, live auctions, and published results on Cheretanet." />
    <meta name="twitter:image" content="https://cheretanet.ethiodeploy.com/images/seo-preview.png" />
    <meta name="twitter:image:alt" content="Cheretanet public auctions in Ethiopia" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cheretanet",
        "url": "https://cheretanet.ethiodeploy.com/",
        "description": "Explore public asset auctions in Ethiopia, review auction notices and bidder requirements, follow live auctions, and see published results.",
        "inLanguage": ["en-ET", "am-ET"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://cheretanet.ethiodeploy.com/auctions?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Fonts & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Newsreader:opsz,wght@6..72,500..600&family=Noto+Sans+Ethiopic:wght@400..700&family=Noto+Serif+Ethiopic:wght@500..700&display=swap" rel="stylesheet" />
